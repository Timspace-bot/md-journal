name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write           # create the GitHub release
  id-token: write           # sign the build provenance (Sigstore)
  attestations: write       # store the attestation
  artifact-metadata: write  # artifact storage record

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          npm test
          npm run lint
          npm run lint:scanner
          npm run build

      - name: Check the tag matches manifest.json
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $VERSION"; exit 1
          fi

      # Lets anyone verify the release files were built here, from this commit:
      #   gh attestation verify main.js --repo Timspace-bot/md-journal
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css
